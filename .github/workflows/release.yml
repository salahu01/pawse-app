name: Release

# Run from the Actions tab (Run workflow → enter a tag like v1.0.1) to build, sign (if secrets
# are set), package and publish a release. Manual on purpose: locally built DMGs get the styled
# Finder window, which a headless runner cannot lay out.
#
# Optional secrets for a Gatekeeper-trusted build:
#   MACOS_CERT_P12        base64 of your "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD   password of that .p12
#   SIGN_IDENTITY         e.g. "Developer ID Application: Your Name (TEAMID)"
#   AC_APPLE_ID / AC_TEAM_ID / AC_PASSWORD   Apple ID, team ID, app-specific password (notarisation)
# Without them the release is ad-hoc signed and users right-click → Open on first launch.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow (DMG background)
        run: python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow

      - name: Import signing certificate
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" login.keychain

      - name: Store notarisation credentials
        if: ${{ env.HAS_NOTARY == 'true' }}
        env:
          HAS_NOTARY: ${{ secrets.AC_PASSWORD != '' }}
        run: |
          xcrun notarytool store-credentials pawse \
            --apple-id "${{ secrets.AC_APPLE_ID }}" --team-id "${{ secrets.AC_TEAM_ID }}" \
            --password "${{ secrets.AC_PASSWORD }}"
          echo "NOTARY_PROFILE=pawse" >> $GITHUB_ENV

      - name: Build app
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: ./tools/bundle.sh release

      - name: Build DMG
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: ./tools/make-dmg.sh

      - name: Zip app
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Pawse.app/Contents/Info.plist)
          ditto -c -k --keepParent build/Pawse.app build/Pawse-$VERSION.zip
          shasum -a 256 build/Pawse-$VERSION.dmg build/Pawse-$VERSION.zip > build/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Pawse-*.dmg
            build/Pawse-*.zip
            build/SHA256SUMS.txt
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
